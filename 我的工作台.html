<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>我的工作台</title>
<style>
*{box-sizing:border-box}
:root{
  --bg:#f5f6f9;--card:#fff;--txt:#161a21;--muted:#6f7787;--line:#e8eaf0;
  --accent:#3b5bdb;--accent-2:#7048e8;--accent-soft:#eef1fe;
  --ok:#0f9f6e;--warn:#d98218;--danger:#e03131;
  --r:16px;--shadow:0 1px 2px rgba(18,22,30,.04),0 10px 28px -14px rgba(18,22,30,.16);
  --shadow-sm:0 1px 2px rgba(18,22,30,.05);
}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:650}
.app{display:flex;align-items:flex-start;min-height:100vh}
.sidebar{width:214px;flex:0 0 214px;background:#fff;border-right:1px solid var(--line);padding:18px 12px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{font-weight:700;font-size:15px;padding:4px 10px 16px;letter-spacing:-.2px}
.navitem{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:9px 10px;border-radius:10px;color:#3d4450;cursor:pointer;font:inherit;text-align:left}
.navitem:hover{background:#f2f4f7}
.navitem.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.navitem .ic{width:18px;text-align:center;opacity:.85;font-size:14px}
.side-foot{margin-top:auto;font-size:11.5px;color:#9aa1ab;padding:10px;line-height:1.5}
main{flex:1;min-width:0;padding:24px 28px 70px;max-width:1260px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.ph h1{font-size:21px;letter-spacing:-.3px}
.sub{color:var(--muted);font-size:12.5px;margin-top:3px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px 17px;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.card-h h3{font-size:14.5px}
.grid{display:grid;gap:16px;margin-bottom:16px}
.g2{grid-template-columns:1.35fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
@media(max-width:1040px){.g2,.g3{grid-template-columns:1fr}}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.input,.select,textarea.input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--txt);font:inherit;outline:none}
.input:focus,.select:focus,textarea.input:focus{border-color:#b9cdfb;box-shadow:0 0 0 3px rgba(47,111,237,.12)}
textarea.input{resize:vertical;line-height:1.6}
.btn{border:1px solid var(--line);background:#fff;color:var(--txt);padding:8px 13px;border-radius:9px;cursor:pointer;font:inherit;white-space:nowrap}
.btn:hover{background:#f4f6f9}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{background:#255ed4}
.btn-sm{padding:5px 9px;font-size:12.5px;border-radius:8px}
.btn-ico{border:0;background:transparent;color:#9aa1ab;cursor:pointer;font-size:13px;padding:4px 6px;border-radius:7px;line-height:1}
.btn-ico:hover{background:#f2f4f7;color:var(--danger)}
.list{display:flex;flex-direction:column}
.item{display:flex;gap:10px;align-items:center;padding:9px 2px;border-bottom:1px dashed var(--line)}
.item:last-child{border-bottom:0}
.it-main{flex:1;min-width:0}
.t{font-size:13.8px;word-break:break-word}
.done .t{text-decoration:line-through;color:#9aa1ab}
.muted{color:var(--muted)}
.xs{font-size:12px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;background:#f2f4f7;color:#5b6472;font-size:11.5px;white-space:nowrap}
.chip.high{background:#fdeceb;color:#c0392b}
.chip.mid{background:#fdf3e4;color:#b97612}
.chip.low{background:#eef1f5;color:#6b7280}
.chip.ok{background:#e8f7f1;color:var(--ok)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.tabs{display:flex;gap:4px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.tab{border:0;background:transparent;padding:9px 12px;border-radius:9px 9px 0 0;cursor:pointer;color:var(--muted);font:inherit;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600;background:#f8faff}
.prog{height:7px;background:#eef1f5;border-radius:999px;overflow:hidden;margin:6px 0 10px}
.prog>i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .25s}
.prog.sm{height:5px;margin:8px 0 0}
.check{width:17px;height:17px;border-radius:5px;border:1.5px solid #c7ccd4;background:#fff;cursor:pointer;flex:0 0 auto;display:grid;place-items:center;color:#fff;font-size:11px;padding:0;line-height:1}
.check.on{background:var(--ok);border-color:var(--ok)}
.empty{color:#9aa1ab;font-size:13px;padding:14px 2px}
.kpi{cursor:pointer;transition:transform .12s,box-shadow .12s}
.kpi:hover{transform:translateY(-1px);box-shadow:0 8px 22px rgba(16,24,40,.08)}
.k-top{color:var(--muted);font-size:12.5px;display:flex;justify-content:space-between}
.k-num{font-size:26px;font-weight:700;letter-spacing:-.6px;margin:6px 0 2px;line-height:1.1}
.k-sub{font-size:12px;color:#8a929e}
.overlay{position:fixed;inset:0;background:rgba(16,24,40,.36);display:grid;place-items:center;z-index:50;padding:24px}
.modal{background:#fff;border-radius:16px;width:min(540px,100%);max-height:86vh;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(16,24,40,.28)}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:15px 18px;border-bottom:1px solid var(--line)}
.modal-h h3{font-size:15px}
.modal-b{padding:16px 18px;overflow:auto;display:flex;flex-direction:column;gap:11px}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:13px 18px;border-top:1px solid var(--line)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12px;color:var(--muted)}
.date-bar{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.weekrow{display:grid;grid-template-columns:70px 1fr;gap:10px;align-items:center;padding:5px 0}
.weekrow .day{font-size:12.5px;color:var(--muted)}
.weekrow.today .day{color:var(--accent);font-weight:600}
.stagebar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;font:inherit;font-size:12.5px;cursor:pointer;color:#5b6472}
.pill.on{background:var(--accent);border-color:var(--accent);color:#fff}
.hr{height:1px;background:var(--line);margin:4px 0}
.bignum{font-size:19px;font-weight:700;letter-spacing:-.3px}
.tagline{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px;align-items:center}

/* ===================== v2 视觉升级 ===================== */
body{background:radial-gradient(1100px 520px at 100% -8%,#eef1ff 0%,rgba(238,241,255,0) 60%),var(--bg);font-size:13.6px}
.sidebar{width:228px;flex:0 0 228px;padding:20px 12px 12px;gap:2px}
.brand{display:flex;align-items:center;gap:9px;font-size:15px;padding:2px 8px 18px;letter-spacing:-.2px}
.brand:before{content:"";width:24px;height:24px;border-radius:8px;flex:0 0 auto;background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 3px 8px -2px rgba(59,91,219,.6)}
.navitem{padding:9px 10px;border-radius:11px;color:#454d5b;font-size:13.5px;position:relative;transition:background .15s,color .15s}
.navitem .ic{width:20px;font-size:14px;opacity:.5;transition:opacity .15s}
.navitem:hover{background:#f4f6fa;color:var(--txt)}
.navitem.on{background:linear-gradient(90deg,rgba(59,91,219,.10),rgba(112,72,232,.04));color:var(--accent);font-weight:650}
.navitem.on .ic{opacity:1}
.navitem.on:before{content:"";position:absolute;left:-12px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.side-foot{margin-top:auto;padding:10px 5px 2px;border-top:1px solid var(--line);font-size:11px;color:#a2a9b4}
.side-foot .foot-title{display:block;font-size:11.5px;color:#8d95a2;margin-bottom:7px}
.side-save{width:100%;padding:9px;border-radius:11px;font-weight:600;background:linear-gradient(180deg,#4c6ef5,#3b5bdb);border-color:#3b5bdb;box-shadow:0 3px 10px -4px rgba(59,91,219,.75);color:#fff;font-size:13px}
.side-save:hover{background:linear-gradient(180deg,#4263ea,#3450c9);color:#fff}
.savetime{text-align:center;font-size:11px;color:#9aa2af;margin:8px 0 10px;font-variant-numeric:tabular-nums}
main{padding:26px 30px 80px;max-width:1280px}
.ph{margin-bottom:20px;align-items:center}
.ph h1{font-size:23px;letter-spacing:-.5px}
.sub{font-size:12.5px;margin-top:4px}
.card{border-radius:var(--r);border:1px solid #ebedf2;padding:16px 18px;box-shadow:var(--shadow);transition:box-shadow .18s}
.card-h{margin-bottom:11px}
.card-h h3{font-size:13.8px;letter-spacing:.1px}

.btn{border-radius:10px;border-color:#e3e6ee;padding:8px 13px;font-size:13.1px;transition:.15s;box-shadow:var(--shadow-sm);color:#2a303a}
.btn:hover{background:#f6f7fb;border-color:#d8dce6}
.btn:active{transform:translateY(1px)}
.btn-primary{background:linear-gradient(180deg,#4c6ef5,#3b5bdb);border-color:#3b5bdb;color:#fff;box-shadow:0 3px 10px -4px rgba(59,91,219,.7)}
.btn-primary:hover{background:linear-gradient(180deg,#4263ea,#3450c9);border-color:#3450c9;color:#fff}
.btn-sm{border-radius:9px;padding:5px 10px;font-size:12.4px}
.btn-danger{color:var(--danger);border-color:#f0d0d0;background:#fff}
.btn-danger:hover{background:#fdf3f3;border-color:#e8b9b9}
.btn-ico{color:#a6adb8;border-radius:8px}
.btn-ico:hover{color:var(--danger);background:#fdf3f3}
.input,.select,textarea.input{border-radius:10px;border-color:#e3e6ee;padding:8px 11px;font-size:13.1px;transition:.15s;background:#fcfcfd}
.input:hover,.select:hover{background:#fff;border-color:#dbe0ea}

.item{padding:10px 2px;border-bottom:1px solid #f2f4f8}
.item:last-child{border-bottom:0}
.t{font-size:13.6px;line-height:1.5}
.check{border-radius:6px;transition:.12s}
.check.on{background:linear-gradient(180deg,#12b07c,#0b8a5f);border-color:#0b8a5f}
.prog{height:6px;background:#eef0f5}
.prog>i{background:linear-gradient(90deg,var(--accent),var(--accent-2))}
.kpi{position:relative;overflow:hidden}
.kpi:after{content:"";position:absolute;right:-34px;top:-34px;width:96px;height:96px;border-radius:50%;background:radial-gradient(circle,rgba(59,91,219,.08),transparent 70%);pointer-events:none}
.kpi:hover{transform:translateY(-2px);box-shadow:0 14px 30px -16px rgba(18,22,30,.28)}

.tabs{gap:2px;border-bottom-color:#ebedf2}
.tab{border-radius:10px 10px 0 0;font-size:13.1px}
.tab.on{background:linear-gradient(180deg,rgba(59,91,219,.07),rgba(59,91,219,0))}

.pill:hover{border-color:#cfd6e4;color:var(--txt)}
.pill.on{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 3px 9px -4px rgba(59,91,219,.8)}
.overlay{backdrop-filter:blur(2px);background:rgba(16,22,32,.42)}

.modal-h{padding:16px 20px}
.modal-b{padding:18px 20px;gap:12px}
.modal-f{padding:14px 20px;background:#fbfbfd;border-radius:0 0 18px 18px}
.field label{font-size:11.8px;font-weight:500;color:#7b8391}
.weekrow{grid-template-columns:82px 1fr}
.weekrow .day{font-size:12.3px}

/* 日历 */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .dow{font-size:11.5px;color:#98a0ad;text-align:center;padding:2px 0 4px;font-weight:500}
.cal .cell{min-height:76px;border:1px solid var(--line);border-radius:11px;padding:6px 7px;background:#fff;cursor:pointer;display:flex;flex-direction:column;gap:4px;transition:.13s;text-align:left;font:inherit;color:inherit}
.cal .cell:hover{border-color:#cbd4e6;background:#fbfcff;box-shadow:0 4px 12px -8px rgba(18,22,30,.3)}
.cal .cell.out{opacity:.34}
.cal .cell.today{border-color:#b9c4f5}
.cal .cell.sel{background:linear-gradient(180deg,#f2f5ff,#eef1fe);border-color:#a9b8f0;box-shadow:0 0 0 2px rgba(59,91,219,.12)}
.cal .dn{font-size:12.2px;font-weight:600;color:#3c4452;font-variant-numeric:tabular-nums}
.cal .cell.sel .dn{color:var(--accent)}
.cal .dots{display:flex;gap:3px;flex-wrap:wrap;min-height:7px}
.dot{width:6px;height:6px;border-radius:50%;flex:0 0 auto}
.cal .cnt{font-size:10px;color:#98a0ad;margin-top:auto}
.cal .tick{font-size:9.5px;color:#0b8a5f;background:#e7f7f0;border-radius:5px;padding:0 4px;align-self:flex-start}

/* 图表 */
.chart{width:100%;display:block;overflow:visible}
.chart .grid-line{stroke:#eef0f5;stroke-width:1}
.chart .lbl{font-size:10px;fill:#9aa2ad}
.chart .area{opacity:.9}
.bar-row{display:grid;grid-template-columns:88px 1fr 58px;gap:10px;align-items:center;padding:6px 0}
.bar-track{display:block;height:8px;background:#f0f2f7;border-radius:999px;overflow:hidden}

/* 提示 */

</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">我的工作台</div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <span class="foot-title">数据只存在这台电脑的浏览器里</span>
      <button class="btn side-save" data-act="save-now">保存</button>
      <div class="savetime" id="saveTime">尚未保存</div>
      <div>建议每月在「数据与设置」导出一次备份</div>
    </div>
  </aside>
  <main id="main"></main>
</div>
<div id="modal-root"></div>

<script>
/* ============================================================
   基础工具
============================================================ */
const KEY = 'lifeos.v1';
const SLOTS = ['早上','上午','下午','晚上','未定'];
const PRIOS = [['high','高'],['mid','中'],['low','低']];
const STAGES = ['选题','草稿','待发布','已发布'];
const PLATFORMS = ['小红书','公众号','抖音','B站','视频号','其他'];
const PSTATUS = ['想法','进行中','暂停','完成'];
const CSTATUS = ['待跟进','进行中','已完成'];
const GSTATUS = ['想玩','在玩','通关','弃坑'];
const MEALS = ['早餐','午餐','晚餐','加餐'];
const PARTS = ['胸','背','腿','肩','手臂','核心','有氧'];
const PART_COLOR = {'胸':'#e8590c','背':'#2f9e44','腿':'#1971c2','肩':'#9c36b5','手臂':'#0c8599','核心':'#f08c00','有氧':'#e03131'};
const MEAL_COLOR = {'早餐':'#f59f00','午餐':'#37b24d','晚餐':'#4c6ef5','加餐':'#9775fa'};
const WEEKNAME = ['周日','周一','周二','周三','周四','周五','周六'];

const pad = n => String(n).padStart(2,'0');
const dstr = d => d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
const todayStr = () => dstr(new Date());
const shift = (s,n) => { const d = new Date(s+'T00:00:00'); d.setDate(d.getDate()+n); return dstr(d); };
const weekdayNum = s => { const g = new Date(s+'T00:00:00').getDay(); return g === 0 ? 7 : g; };
const weekName = s => WEEKNAME[new Date(s+'T00:00:00').getDay()];
const fmtDate = s => { if(!s) return ''; const p = s.split('-'); return (+p[1]) + '月' + (+p[2]) + '日'; };
const uid = () => Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-3);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const val = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };

function weekRange(){
  const t = todayStr();
  const mon = shift(t, -(weekdayNum(t)-1));
  return [mon, shift(mon,6)];
}

/* ---------- 日历 ---------- */
function shiftMonth(m, n){
  const [y, mo] = m.split('-').map(Number);
  const d = new Date(y, mo - 1 + n, 1);
  return d.getFullYear() + '-' + pad(d.getMonth()+1);
}
function monthLabel(m){
  const [y, mo] = m.split('-').map(Number);
  return y + ' 年 ' + mo + ' 月';
}
/* 周一为首列，补齐首尾空格，返回 7 的倍数个格子 */
function monthCells(m){
  const [y, mo] = m.split('-').map(Number);
  const first = new Date(y, mo-1, 1);
  const lead = (first.getDay() + 6) % 7;
  const days = new Date(y, mo, 0).getDate();
  const cells = [];
  for(let i = lead; i > 0; i--){ const d = new Date(y, mo-1, 1-i); cells.push({date:dstr(d), day:d.getDate(), out:true}); }
  for(let i = 1; i <= days; i++){ const d = new Date(y, mo-1, i); cells.push({date:dstr(d), day:i, out:false}); }
  let nx = 1;
  while(cells.length % 7 !== 0){ const d = new Date(y, mo, nx++); cells.push({date:dstr(d), day:d.getDate(), out:true}); }
  return cells;
}
function calendarHtml(month, selDate, cellFn){
  const head = ['一','二','三','四','五','六','日'].map(d => `<div class="dow">${d}</div>`).join('');
  const cells = monthCells(month).map(c => {
    const cls = ['cell'];
    if(c.out) cls.push('out');
    if(c.date === todayStr()) cls.push('today');
    if(c.date === selDate) cls.push('sel');
    return `<button class="${cls.join(' ')}" data-act="cal-pick" data-date="${c.date}">${cellFn(c)}</button>`;
  }).join('');
  return `<div class="cal">${head}${cells}</div>`;
}
function timeAgo(ts){
  const m = Math.floor((Date.now()-ts)/60000);
  if(m < 1) return '刚刚';
  if(m < 60) return m + ' 分钟前';
  const h = Math.floor(m/60);
  if(h < 24) return h + ' 小时前';
  const d = Math.floor(h/24);
  if(d < 30) return d + ' 天前';
  return new Date(ts).toLocaleDateString('zh-CN');
}

/* ============================================================
   数据层
============================================================ */
function blank(){
  return {
    version: 1,
    plans: [],      // {id,date,text,slot,priority,done}
    memos: [],      // {id,text,ts}
    ideas: [],      // {id,text,tags,ts,used}
    contents: [],   // {id,title,platform,planDate,stage,body,created}
    metrics: [],    // {id,contentId,date,views,likes,note}
    projects: [],   // {id,name,desc,status,tasks:[],issues:[]}
    consults: [],   // {id,who,topic,date,status,followUp,summary}
    fitness: { week: {'1':'','2':'','3':'','4':'','5':'','6':'','7':''}, logs: [] },
    food: { items: [] },  // {id,date,slot,text}
    games: [],      // {id,name,status}
    plays: []       // {id,gameId,date,minutes}
  };
}
/* 把任意来源的数据补齐成合法结构：缺字段补默认值，类型不对就重置 */
function normalize(raw){
  const d = Object.assign(blank(), (raw && typeof raw === 'object') ? raw : {});
  if(!d.version) d.version = 1;
  ['plans','memos','ideas','contents','metrics','projects','consults','games','plays']
    .forEach(k => { if(!Array.isArray(d[k])) d[k] = []; });
  d.fitness = (d.fitness && typeof d.fitness === 'object') ? d.fitness : {};
  d.fitness.week = Object.assign({'1':'','2':'','3':'','4':'','5':'','6':'','7':''}, d.fitness.week || {});
  if(!Array.isArray(d.fitness.logs)) d.fitness.logs = [];
  /* 训练记录：旧版只有 {date,note}，补成 {date,part,ex,sets,reps,note} */
  d.fitness.logs = d.fitness.logs.filter(l => l && typeof l === 'object' && l.date);
  d.fitness.logs.forEach(l => {
    if(typeof l.part !== 'string') l.part = '';
    if(typeof l.ex !== 'string') l.ex = '';
    if(!l.ex && l.note) l.ex = String(l.note);
    if(typeof l.note !== 'string') l.note = '';
    l.sets = +l.sets || 0;
    l.reps = +l.reps || 0;
  });
  d.food = (d.food && typeof d.food === 'object') ? d.food : {};
  if(!Array.isArray(d.food.items)) d.food.items = [];
  d.projects.forEach(p => {
    if(!Array.isArray(p.tasks)) p.tasks = [];
    if(!Array.isArray(p.issues)) p.issues = [];
  });
  return d;
}

function load(){
  try {
    const raw = localStorage.getItem(KEY);
    if(!raw) return blank();
    return normalize(JSON.parse(raw));
  } catch(e){ return blank(); }
}

let storageWarned = false;

let toastTimer = null;
function toast(msg){
  let el = document.getElementById('toast');
  if(!el){ el = document.createElement('div'); el.id = 'toast'; el.className = 'toast'; document.body.appendChild(el); }
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('on'), 1600);
}

function stampSaved(){
  const d = new Date();
  const el = document.getElementById('saveTime');
  if(el) el.textContent = '已保存 ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
}

function save(){
  const payload = JSON.stringify(db);
  try {
    localStorage.setItem(KEY, payload);
    if(localStorage.getItem(KEY) !== payload && !storageWarned){
      storageWarned = true;
      alert('数据可能没有保存成功：浏览器存储不可用。请立即在「数据与设置」导出备份。');
    }
    stampSaved();
  }
  catch(e){
    if(!storageWarned){
      storageWarned = true;
      alert('保存失败：浏览器存储空间可能已满或不可用，请先导出备份。');
    }
  }
}

/* ---------- 图表（纯 SVG，不依赖任何库） ---------- */
function daySeries(n){
  const out = [];
  for(let i = n - 1; i >= 0; i--){
    const d = shift(todayStr(), -i);
    const rows = db.metrics.filter(r => r.date === d);
    out.push({
      date: d,
      v: rows.reduce((s,r) => s + (+r.views || 0), 0),
      k: rows.reduce((s,r) => s + (+r.likes || 0), 0)
    });
  }
  return out;
}

function areaChart(series){
  const W = 620, H = 190, PL = 30, PR = 10, PT = 16, PB = 26;
  const n = series.length;
  const max = Math.max(1, ...series.map(s => s.v));
  const x = i => PL + (W - PL - PR) * (n <= 1 ? 0 : i / (n - 1));
  const y = v => PT + (H - PT - PB) * (1 - v / max);
  const pts = series.map((s,i) => [x(i), y(s.v)]);
  const line = pts.map((p,i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
  const area = line + ` L${x(n-1).toFixed(1)},${H-PB} L${PL},${H-PB} Z`;
  const grid = [0, .5, 1].map(r => {
    const gy = (PT + (H - PT - PB) * r).toFixed(1);
    return `<line class="grid-line" x1="${PL}" y1="${gy}" x2="${W-PR}" y2="${gy}"/>`;
  }).join('');
  const dots = pts.map((p,i) => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${n > 20 ? 2 : 3}" fill="#3b5bdb"><title>${series[i].date}：${series[i].v} 播放</title></circle>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">
    <defs><linearGradient id="agrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b5bdb" stop-opacity=".24"/>
      <stop offset="100%" stop-color="#3b5bdb" stop-opacity="0"/>
    </linearGradient></defs>
    ${grid}
    <path d="${area}" fill="url(#agrad)"/>
    <path d="${line}" fill="none" stroke="#3b5bdb" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}
    <text class="lbl" x="${PL - 4}" y="${PT + 4}" text-anchor="end">${max}</text>
    <text class="lbl" x="${PL - 4}" y="${H - PB}" text-anchor="end">0</text>
    <text class="lbl" x="${PL}" y="${H - 8}">${fmtDate(series[0].date)}</text>
    <text class="lbl" x="${W - PR}" y="${H - 8}" text-anchor="end">${fmtDate(series[n-1].date)}</text>
  </svg>`;
}

function platformBars(){
  const map = {};
  db.metrics.forEach(r => {
    const c = db.contents.find(x => x.id === r.contentId);
    const p = c ? (c.platform || '未定平台') : '（内容已删）';
    map[p] = (map[p] || 0) + (+r.views || 0);
  });
  const rows = Object.keys(map).map(k => [k, map[k]]).sort((a,b) => b[1] - a[1]);
  if(!rows.length) return '<div class="empty">还没有数据，先记一条</div>';
  const max = Math.max(...rows.map(r => r[1])) || 1;
  return rows.slice(0, 6).map(([k,v]) => `
    <div class="bar-row">
      <span class="bar-name">${esc(k)}</span>
      <span class="bar-track"><i class="bar-fill" style="width:${Math.max(2, Math.round(v / max * 100))}%"></i></span>
      <span class="bar-val">${v}</span>
    </div>`).join('');
}

   6. 健身
============================================================ */
function viewFitness(){
  const t = todayStr();
  const wd = String(weekdayNum(t));
  const streak = fitStreak();
  const dayLogs = db.fitness.logs.filter(l => l.date === fitDate);
  const plan = db.fitness.week[String(weekdayNum(fitDate))] || '';
  const trainedDays = new Set(db.fitness.logs.filter(l => l.date.slice(0,7) === fitMonth).map(l => l.date)).size;

  const cal = calendarHtml(fitMonth, fitDate, c => {
    const ls = db.fitness.logs.filter(l => l.date === c.date);
    const parts = [];
    ls.forEach(l => { if(l.part && parts.indexOf(l.part) < 0) parts.push(l.part); });
    const dots = parts.slice(0,4).map(p => `<span class="dot" style="background:${PART_COLOR[p] || '#adb5bd'}"></span>`).join('');
    return `<div class="dn">${c.day}</div><div class="dots">${dots}</div>${ls.length ? `<div class="cnt">${ls.length} 个动作</div>` : ''}`;
  });

  const rows = dayLogs.length ? dayLogs.map(l => {
    const vol = (l.sets && l.reps) ? `${l.sets} 组 × ${l.reps} 次` : (l.sets ? `${l.sets} 组` : (l.reps ? `${l.reps} 次` : '未记组次'));
    return `<div class="item">
      <span class="chip acc">${esc(l.part || '未分类')}</span>
      <div class="it-main">
        <div class="t">${esc(l.ex || '（未填动作）')}</div>
        <div class="muted xs">${vol}${l.note ? ' · ' + esc(l.note) : ''}</div>
      </div>
      <button class="btn-ico" data-act="fit-del" data-id="${l.id}" title="删除这条记录">✕</button>
    </div>`;
  }).join('') : '<div class="empty">这天还没有训练记录，下面加一条</div>';

  const weekRows = [1,2,3,4,5,6,7].map(n => `
    <div class="weekrow ${String(n)===wd?'today':''}">
      <div class="day">周${'一二三四五六日'[n-1]}${String(n)===wd?' ·今天':''}</div>
      <input class="input" value="${esc(db.fitness.week[String(n)]||'')}" data-act="fit-week" data-day="${n}" placeholder="练什么（留空表示休息）">
    </div>`).join('');

  return `
  <div class="ph">
    <div><h1>健身计划</h1><div class="sub">连续打卡 ${streak} 天 · 本月已练 ${trainedDays} 天 · 共 ${db.fitness.logs.length} 条动作记录</div></div>
    <button class="btn" data-act="fit-today">回到今天</button>
  </div>

  <div class="grid g2">
    <section class="card">
      <div class="card-h">
        <h3>训练日历</h3>
        <div class="row">
          <button class="btn btn-sm" data-act="fit-month" data-n="-1">‹</button>
          <span class="muted xs" style="min-width:88px;text-align:center">${monthLabel(fitMonth)}</span>
          <button class="btn btn-sm" data-act="fit-month" data-n="1">›</button>
        </div>
      </div>
      ${cal}
      <div class="row wrap" style="margin-top:12px;gap:12px">
        ${PARTS.map(p=>`<span class="xs muted" style="display:inline-flex;align-items:center;gap:5px"><span class="dot" style="background:${PART_COLOR[p]}"></span>${p}</span>`).join('')}
      </div>
    </section>

    <section class="card">
      <div class="card-h">
        <h3>${fmtDate(fitDate)} · ${weekName(fitDate)}</h3>
        <span class="chip ${dayLogs.length?'ok':''}">${dayLogs.length ? dayLogs.length + ' 个动作' : '未记录'}</span>
      </div>
      <div class="muted xs" style="margin-bottom:8px">当天计划：${plan ? esc(plan) : '休息日'}</div>
      <div class="list">${rows}</div>
      <div class="hr" style="margin:12px 0"></div>
      <div class="row" style="margin-bottom:8px">
        <select class="select" id="fitPart" style="width:94px">${PARTS.map(p=>`<option>${p}</option>`).join('')}</select>
        <input class="input" id="fitEx" placeholder="动作，例如：卧推" data-enter="fit-add">
      </div>
      <div class="row">
        <input class="input" id="fitSets" type="number" min="0" placeholder="组数" style="width:78px">
        <input class="input" id="fitReps" type="number" min="0" placeholder="次数" style="width:78px">
        <button class="btn btn-primary" data-act="fit-add" style="flex:1">＋ 记录到这一天</button>
      </div>
    </section>
  </div>

  <section class="card">
    <div class="card-h"><h3>每周安排</h3><span class="muted xs">改完自动保存；日历里作为当天的「计划」显示</span></div>
    ${weekRows}
  </section>`;
}

function fitStreak(){
  let n = 0, d = todayStr();
  if(!db.fitness.logs.some(l => l.date === d)) d = shift(d,-1);
  while(db.fitness.logs.some(l => l.date === d)){ n++; d = shift(d,-1); }
  return n;
}

  const rows = db.games.length ? db.games.map(g => {

    return `<div class="item">

function closeModal(){ document.getElementById('modal-root').innerHTML = ''; }
function openModal(opt){
  const root = document.getElementById('modal-root');
  root.innerHTML = `<div class="overlay"><div class="modal">
    <div class="modal-h"><h3>${esc(opt.title)}</h3><button class="btn-ico" data-act="modal-close">✕</button></div>
    <div class="modal-b">${opt.body}</div>
    <div class="modal-f">
      <button class="btn" data-act="modal-close">取消</button>
      <button class="btn btn-primary" id="modalSave">${esc(opt.submit||'保存')}</button>
    </div>
  </div></div>`;
  root.querySelector('.overlay').addEventListener('click', e => { if(e.target.classList.contains('overlay')) closeModal(); });
  root.querySelector('#modalSave').addEventListener('click', () => {
    if(opt.onSave() !== false){ closeModal(); }
  });
  const first = root.querySelector('input,textarea,select');
  if(first) setTimeout(()=>first.focus(), 30);
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const a = el.dataset.act;
  const id = el.dataset.id;

  switch(a){
    /* 导航 */
    case 'go': route = el.dataset.route; devOpen = null; render(); break;
    case 'reload': location.reload(); break;

    /* 手动保存 */
    case 'save-now': save(); toast('已保存'); break;

    /* 日历选中某天 */
    case 'cal-pick': {
      const d = el.dataset.date;
      if(route === 'fitness'){ fitDate = d; fitMonth = d.slice(0,7); }
      if(route === 'food'){ foodDate = d; foodMonth = d.slice(0,7); }
      render(); break;
    }

    /* 计划 */
    case 'home-plan': addPlan(todayStr(), 'homePlan'); break;
    case 'plan-add': addPlan(planDate, 'planText'); break;
    case 'plan-toggle': {
      const p = db.plans.find(x=>x.id===id); if(p){ p.done = !p.done; save(); render(); } break;
    }
    case 'plan-del': {
      if(!confirm('删除这条计划？')) return;
      db.plans = db.plans.filter(x=>x.id!==id); save(); render(); break;
    }
    case 'plan-later': {
      const p = db.plans.find(x=>x.id===id);
      if(p){ p.date = shift(p.date,1); save(); render(); } break;
    }
    case 'plan-shift': planDate = shift(planDate, +el.dataset.n); render(); break;
    case 'plan-today': planDate = todayStr(); render(); break;

    /* 备忘 */
    case 'memo-add': addMemo(); break;
    case 'memo-del': db.memos = db.memos.filter(x=>x.id!==id); save(); render(); break;

    /* 自媒体 */
    case 'sm-tab': smTab = el.dataset.tab; render(); break;
    case 'idea-add': addIdea(); break;
    case 'idea-use': {
      const i = db.ideas.find(x=>x.id===id);
      if(i){
        db.contents.unshift({id:uid(), title:i.text, platform:'小红书', planDate:'', stage:'选题', body:'', created:Date.now()});
        i.used = true; smTab = 'content'; save(); render();
      } break;
    }
    case 'idea-del': db.ideas = db.ideas.filter(x=>x.id!==id); save(); render(); break;
    case 'idea-toggle-used': showUsedIdeas = !showUsedIdeas; render(); break;
    case 'cm-stage': cmStage = el.dataset.s; render(); break;
    case 'content-new': contentModal(null); break;
    case 'content-edit': contentModal(id); break;
    case 'content-del': {
      if(!confirm('删除这条内容？')) return;
      db.contents = db.contents.filter(x=>x.id!==id);
      db.metrics = db.metrics.filter(m=>m.contentId!==id);
      save(); render(); break;
    }
    case 'metric-new': metricModal(); break;
    case 'metric-del': db.metrics = db.metrics.filter(x=>x.id!==id); save(); render(); break;
    case 'm-range': mRange = +el.dataset.n; render(); break;

    /* 开发 */
    case 'dev-new': devModal(null); break;
    case 'dev-edit': devModal(id); break;
    case 'dev-item-new': workItemModal(el.dataset.pid); break;
    case 'dev-open': devOpen = id; render(); break;
    case 'dev-close': devOpen = null; render(); break;
    case 'dev-del': {
      if(!confirm('删除这个项目（含任务和问题记录）？')) return;
      db.projects = db.projects.filter(x=>x.id!==id);
      if(devOpen === id) devOpen = null;
      save(); render(); break;
    }
    case 'dev-task-add': {
      const p = db.projects.find(x=>x.id===devOpen); const v = val('devTaskInput');
      if(p && v){ p.tasks.push({id:uid(), text:v, done:false}); save(); render(); }
      else if(p) document.getElementById('devTaskInput').focus();
      break;
    }
    case 'dev-task-toggle': {
      const p = db.projects.find(x=>x.id===el.dataset.pid);
      const t = p && p.tasks.find(x=>x.id===id);
      if(t){ t.done = !t.done; save(); render(); } break;
    }
    case 'dev-task-del': {
      const p = db.projects.find(x=>x.id===el.dataset.pid);
      if(p){ p.tasks = p.tasks.filter(x=>x.id!==id); save(); render(); } break;
    }
    case 'dev-issue-add': {
      const p = db.projects.find(x=>x.id===devOpen); const v = val('devIssueInput');
      if(p && v){ p.issues.push({id:uid(), text:v, resolved:false}); save(); render(); }
      break;
    }
    case 'dev-issue-toggle': {
      const p = db.projects.find(x=>x.id===el.dataset.pid);
      const i = p && p.issues.find(x=>x.id===id);
      if(i){ i.resolved = !i.resolved; save(); render(); } break;
    }
    case 'dev-issue-del': {
      const p = db.projects.find(x=>x.id===el.dataset.pid);
      if(p){ p.issues = p.issues.filter(x=>x.id!==id); save(); render(); } break;
    }

    /* 咨询 */
    case 'consult-new': consultModal(null); break;
    case 'consult-edit': consultModal(id); break;
    case 'consult-del': {
      if(!confirm('删除这条咨询记录？')) return;
      db.consults = db.consults.filter(x=>x.id!==id); save(); render(); break;
    }
    case 'consult-filter': cfFilter = el.dataset.f; render(); break;

    /* 健身 */
    case 'fit-month': {
      fitMonth = shiftMonth(fitMonth, +el.dataset.n);
      fitDate = (fitMonth === todayStr().slice(0,7)) ? todayStr() : fitMonth + '-01';
      render(); break;
    }
    case 'fit-today': fitDate = todayStr(); fitMonth = todayStr().slice(0,7); render(); break;
    case 'fit-add': {
      const ex = val('fitEx');
      if(!ex){ const box = document.getElementById('fitEx'); if(box) box.focus(); toast('先填动作名称'); break; }
      db.fitness.logs.push({
        id: uid(), date: fitDate,
        part: val('fitPart') || PARTS[0],
        ex,
        sets: +val('fitSets') || 0,
        reps: +val('fitReps') || 0,
        note: ''
      });
      save(); render(); toast('已记录到 ' + fmtDate(fitDate));
      break;
    }
    case 'fit-del': db.fitness.logs = db.fitness.logs.filter(l => l.id !== id); save(); render(); break;

    /* 饮食 */
    case 'food-month': {
      foodMonth = shiftMonth(foodMonth, +el.dataset.n);
      foodDate = (foodMonth === todayStr().slice(0,7)) ? todayStr() : foodMonth + '-01';
      render(); break;
    }
    case 'food-shift': foodDate = shift(foodDate, +el.dataset.n); foodMonth = foodDate.slice(0,7); render(); break;
    case 'food-today': foodDate = todayStr(); foodMonth = foodDate.slice(0,7); render(); break;
    case 'food-add': addFood(el.dataset.slot); break;
    case 'food-del': db.food.items = db.food.items.filter(x=>x.id!==id); save(); render(); break;
    case 'food-quick': {
      const slot = document.getElementById('commonSlot');
      db.food.items.push({id:uid(), date:foodDate, slot: slot ? slot.value : '午餐', text: el.dataset.text});
      save(); render(); break;
    }

    /* 游戏 */
    case 'game-new': gameModal(); break;
    case 'game-log': {
      db.plays.push({id:uid(), gameId:id, date:todayStr(), minutes:+el.dataset.min||30});
      save(); render(); break;
    }
    case 'game-log-custom': gameLogModal(id); break;
    case 'game-del': {
      if(!confirm('删除这个游戏（含时长记录）？')) return;
      db.games = db.games.filter(x=>x.id!==id);
      db.plays = db.plays.filter(p=>p.gameId!==id);
      save(); render(); break;
    }
    case 'play-del': db.plays = db.plays.filter(x=>x.id!==id); save(); render(); break;

    /* 设置 */
    case 'export': exportData(); break;
    case 'import': document.getElementById('importFile').click(); break;
    case 'clear': {
      if(!confirm('确定清空全部数据？此操作不能撤销。')) return;
      if(!confirm('再确认一次：所有计划、内容、记录都会被删除。')) return;
      db = blank(); save(); render(); break;
    }

    /* 弹窗 */
    case 'modal-close': closeModal(); break;
  }
});

document.addEventListener('change', e => {
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const a = el.dataset.act, id = el.dataset.id;

  if(a === 'plan-date'){ planDate = el.value || todayStr(); render(); }
  if(a === 'content-stage'){ const c = db.contents.find(x=>x.id===id); if(c){ c.stage = el.value; save(); render(); } }
  if(a === 'dev-status'){ const p = db.projects.find(x=>x.id===id); if(p){ p.status = el.value; save(); render(); } }
  if(a === 'consult-status'){ const c = db.consults.find(x=>x.id===id); if(c){ c.status = el.value; save(); render(); } }
  if(a === 'fit-week'){ db.fitness.week[el.dataset.day] = el.value.trim(); save(); }
  if(a === 'game-status'){ const g = db.games.find(x=>x.id===id); if(g){ g.status = el.value; save(); render(); } }
});

document.addEventListener('keydown', e => {
  if((e.ctrlKey || e.metaKey) && String(e.key).toLowerCase() === 's'){ e.preventDefault(); save(); toast('已保存'); return; }
  if(e.key === 'Escape'){ closeModal(); return; }
  const cmd = e.target.dataset && e.target.dataset.enter;
  if(!cmd || e.key !== 'Enter') return;
  e.preventDefault();
  if(cmd === 'home-plan') addPlan(todayStr(), 'homePlan');
  else if(cmd === 'plan-add') addPlan(planDate, 'planText');
  else if(cmd === 'memo-add') addMemo();
  else if(cmd === 'idea-add') addIdea();
  else if(cmd === 'dev-task-add') document.querySelector('[data-act="dev-task-add"]').click();
  else if(cmd === 'dev-issue-add') document.querySelector('[data-act="dev-issue-add"]').click();
  else if(cmd === 'fit-add') document.querySelector('[data-act="fit-add"]').click();
  else if(cmd === 'food-add') addFood(e.target.dataset.slot);
  else if(cmd === 'wi-save'){ const b = document.getElementById('modalSave'); if(b) b.click(); }
});

document.addEventListener('change', e => {
  if(e.target && e.target.id === 'importFile'){
    const f = e.target.files && e.target.files[0];
    if(!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if(!data || typeof data !== 'object' || !('version' in data)) throw new Error('格式不对');
        if(!confirm('导入会覆盖当前全部数据，继续吗？')) return;
        db = normalize(data);
        save(); render(); alert('导入完成');
      } catch(err){ alert('导入失败：文件不是有效的备份'); }
    };
    reader.readAsText(f);
    e.target.value = '';
  }
});

/* ============================================================
   写入函数
============================================================ */
function addPlan(date, inputId){
  const el = document.getElementById(inputId);
  const text = el ? el.value.trim() : '';
  if(!text){ if(el) el.focus(); return; }
  const slotEl = document.getElementById('planSlot');
  const prioEl = document.getElementById('planPrio');
  db.plans.push({
    id: uid(), date, text,
    slot: slotEl ? slotEl.value : '未定',
    priority: prioEl ? prioEl.value : 'mid',
    done: false
  });
  save(); render();
}

function addMemo(){
  const el = document.getElementById('memoInput');
  const text = el ? el.value.trim() : '';
  if(!text) return;
  db.memos.unshift({id:uid(), text, ts:Date.now()});
  if(db.memos.length > 300) db.memos.length = 300;
  save(); render();
}

function addIdea(){
  const t = document.getElementById('ideaText');
  const g = document.getElementById('ideaTags');
  const text = t ? t.value.trim() : '';
  if(!text) return;
  db.ideas.unshift({id:uid(), text, tags: g ? g.value.trim() : '', ts:Date.now(), used:false});
  save(); render();
}

function addFood(slot){
  const el = document.getElementById('food-' + slot);
  const text = el ? el.value.trim() : '';
  if(!text) return;
  db.food.items.push({id:uid(), date:foodDate, slot, text});
  save(); render();
}

function gameModal(){
  openModal({
    title: '添加游戏',
    body: `
      <div class="field"><label>游戏名</label><input class="input" id="gName" placeholder="例如：空洞骑士"></div>
      <div class="field"><label>状态</label><select class="select" id="gStatus">${GSTATUS.map(s=>`<option ${s==='在玩'?'selected':''}>${s}</option>`).join('')}</select></div>`,
    onSave(){
      const name = val('gName');
      if(!name){ alert('先填游戏名'); return false; }
      db.games.unshift({id:uid(), name, status: val('gStatus')});
      save(); render();
    }
  });
}

function gameLogModal(id){
  const g = db.games.find(x=>x.id===id);
  openModal({
    title: '记录时长 · ' + (g ? g.name : ''),
    body: `
      <div class="row" style="gap:10px">
        <div class="field" style="flex:1"><label>日期</label><input class="input" type="date" id="pDate" value="${todayStr()}"></div>
        <div class="field" style="flex:1"><label>分钟</label><input class="input" type="number" min="1" id="pMin" value="45"></div>
      </div>`,
    onSave(){
      const min = +val('pMin') || 0;
      if(min <= 0){ alert('填个有效分钟数'); return false; }
      db.plays.push({id:uid(), gameId:id, date: val('pDate')||todayStr(), minutes:min});
      save(); render();
    }
  });
}

function exportData(){
  const blob = new Blob([JSON.stringify(db,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '工作台备份-' + todayStr() + '.json';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 3000);
}

/* ============================================================
   启动
============================================================ */
render();
</script>
</body>
</html>
